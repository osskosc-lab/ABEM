name: phase0c_confirmatory
confirmatory: true
seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]
episodes_per_seed: 16

# OOD shift: stronger cross-bit coupling and more interaction edges.
# Do not tune search/memory/metric values after viewing these results.
landscape:
  dimension: 32
  block_size: 4
  interaction_strength: 0.55
  deceptive_bonus: 0.72
  optimum_bonus: 1.0
  interaction_edges: 16

search:
  population_size: 24
  elite_size: 6
  mutation_rate: 0.08
  memory_bias: 0.35
  t_min: 4
  t_max: 64
  fixed_depth: 16
  hazard_threshold: 4.0
  b0: -1.0
  b_stagnation: 0.25
  b_gain: 5.0
  b_uncertainty: 1.2
  b_diversity: 1.0

memory:
  learning_rate: 0.12
  decay: 0.08
  clip: 2.5

metric:
  cost_weight: 0.25
  support_ratio: 0.90
  bootstrap_samples: 5000
  mechanism_margin: 0.02
