name: ABEM Phase 0 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Smoke experiment
        run: python -m abem.experiment --config configs/smoke.yaml --output results/ci-smoke/summary.json
